[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisflight"
version = "0.1.0"
description = "AegisFlight - Hybrid Real-Time Intrusion Detection System for UAV Cyber-Physical Security"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Team Ardra" }]
keywords = ["uav", "drone", "ids", "mavlink", "security", "anomaly-detection"]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "pymavlink>=2.4.40",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# External real-flight validation (PX4 ULog parsing); see docs/EXTERNAL_DATA.md
external = [
    "pyulog>=1.1",
]
# Serial MAVLink transport (Stage-2 hardware path); imported lazily, so the core install is unaffected
serial = [
    "pyserial>=3.5",
]
dev = [
    "pyserial>=3.5",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
aegis = "aegisflight.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aegisflight = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "backend", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
# E501: line length handled by formatter; B008: FastAPI Depends() default;
# UP042: enums deliberately use (str, Enum) for JSON-serialisation clarity.
ignore = ["E501", "B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Plotting code uses semicolons to keep paired axis calls compact.
"src/aegisflight/benchmark/plots.py" = ["E702"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
